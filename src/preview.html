<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>httpstat</title>
<style>
  :root {
    color-scheme: light;
    /*
     * The host's resolved tokens arrive as --mp-* (D-1043); every value below
     * prefers them and keeps this document's own palette as the fallback for
     * an older host. The host owns the theme, so there is no second copy.
     */
    --bg: var(--mp-surface-solid, #f6f2ea);
    --panel: var(--mp-surface-raised, #fbf8f2);
    --ink: var(--mp-ink, #241f19);
    --muted: var(--mp-ink-soft, #776b5c);
    --line: var(--mp-line, rgba(60, 45, 25, 0.16));
    --accent: var(--mp-accent, #9a5427);
    --accent-ink: var(--mp-accent-ink, #fff8ef);
    --success: var(--mp-success, #2f7d4f);
    --danger: var(--mp-danger, #a53a2a);
    --focus: color-mix(in srgb, var(--mp-accent, #9a5427) 40%, transparent);
    --body: var(--mp-font-body, -apple-system, "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;

    /*
     * Corner system (host D-1099): one ladder owns every box on this page.
     * --radius-sm for controls, --radius-md for cards and rows,
     * --radius-lg for the outer panels.
     */
    --radius-xs: 4px;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-pill: 999px;

    /* One hue per measured phase; the timeline, chips and table share it. */
    --phase-dns: #b06a2c;
    --phase-connect: #3f7f6b;
    --phase-tls: #6b63a8;
    --phase-server: #a94b3f;
    --phase-transfer: #7a6c50;
  }
  :root[data-scheme="dark"] {
    color-scheme: dark;
    --bg: var(--mp-surface-solid, #171412);
    --panel: var(--mp-surface-raised, #201c18);
    --ink: var(--mp-ink, #f0e6d9);
    --muted: var(--mp-ink-soft, #9a8c7b);
    --line: var(--mp-line, rgba(255, 236, 214, 0.14));
    --accent: var(--mp-accent, #e2955f);
    --accent-ink: var(--mp-accent-ink, #241a12);
    --success: var(--mp-success, #7cbf94);
    --danger: var(--mp-danger, #e08a7c);
    --focus: color-mix(in srgb, var(--mp-accent, #e2955f) 45%, transparent);

    --phase-dns: #e0a06a;
    --phase-connect: #6fbba2;
    --phase-tls: #a49bdd;
    --phase-server: #e08a7c;
    --phase-transfer: #b8a98b;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font: 13.5px/1.55 var(--body);
    overflow: hidden;
  }
  [hidden] { display: none !important; }
  button { font-family: inherit; cursor: pointer; }
  :focus-visible { outline: none; }

  .doc-head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 40px;
    padding: 0 12px;
    border-bottom: 1px solid var(--line);
  }
  .doc-icon { width: 16px; height: 16px; flex: none; color: var(--accent); }
  .doc-title { font-size: 12.5px; font-weight: 650; letter-spacing: 0.02em; }
  .doc-close {
    margin-left: auto;
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--muted);
  }
  .doc-close:hover { color: var(--ink); border-color: var(--line); background: var(--panel); }
  .doc-close:focus-visible { box-shadow: inset 0 0 0 1px var(--focus); }
  .doc-close svg { width: 14px; height: 14px; }

  .probe {
    flex: none;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  .field { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .field-label {
    font-size: 10px;
    font-weight: 650;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #url {
    width: 100%;
    height: 30px;
    padding: 0 9px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--panel);
    color: var(--ink);
    font: 12.5px/1 var(--mono);
  }
  #url::placeholder { color: var(--muted); opacity: 0.7; }
  #url:focus { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--focus); outline: none; }
  #run {
    flex: none;
    height: 30px;
    padding: 0 14px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    background: var(--accent);
    color: var(--accent-ink);
    font: 600 12px/1 var(--body);
  }
  #run:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
  #run:disabled { opacity: 0.6; cursor: progress; }
  #run:focus-visible { box-shadow: inset 0 0 0 1px var(--focus); }

  main { flex: 1; overflow: auto; padding: 14px 12px 18px; }
  .shell { max-width: 840px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .status { margin: 0; min-height: 17px; font-size: 12px; color: var(--muted); }
  .status[data-tone="error"] { color: var(--danger); }

  .error {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
    border: 1px solid color-mix(in srgb, var(--danger) 42%, var(--line));
    border-radius: var(--radius-md);
    background: color-mix(in srgb, var(--danger) 7%, var(--panel));
  }
  .error p { margin: 0; flex: 1; font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
  .error button {
    flex: none;
    height: 28px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--panel);
    color: var(--ink);
    font: 600 11.5px/1 var(--body);
  }
  .error button:hover { border-color: var(--muted); }
  .error button:focus-visible { box-shadow: inset 0 0 0 1px var(--focus); }

  .result { display: flex; flex-direction: column; gap: 14px; }
  .verdict {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--panel);
  }
  .verdict-main { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .status-code {
    font: 650 24px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .status-code[data-tone="ok"] { color: var(--success); }
  .status-code[data-tone="warn"] { color: var(--accent); }
  .status-code[data-tone="bad"] { color: var(--danger); }
  .status-text { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
  .verdict-total { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .verdict-label {
    font-size: 10px;
    font-weight: 650;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .total { font: 650 18px/1 var(--mono); font-variant-numeric: tabular-nums; }
  .facts {
    margin: 0;
    font-size: 11.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }

  .waterfall { display: flex; flex-direction: column; }
  /*
   * The phase names sit above the bar, one cell per measured span, so the
   * timeline reads the way the terminal's does: label and duration over the
   * span, then the cumulative marks underneath at the boundaries they mark.
   */
  .phase-strip { display: flex; align-items: flex-end; min-height: 27px; }
  .phase-cell {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 1px;
    padding-right: 6px;
    line-height: 1.3;
    color: var(--muted);
    font-size: 10.5px;
  }
  .phase-head { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .phase-head i {
    width: 6px;
    height: 6px;
    flex: none;
    border-radius: 50%;
    background: var(--phase);
  }
  .phase-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .phase-cell b {
    color: var(--ink);
    font-size: 11px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track {
    position: relative;
    height: 26px;
    margin-top: 6px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: color-mix(in srgb, var(--ink) 4%, var(--panel));
    overflow: hidden;
  }
  .segment { position: absolute; top: 0; bottom: 0; min-width: 2px; background: var(--phase); }
  .tick {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 0;
    border-left: 1px dashed color-mix(in srgb, var(--ink) 45%, transparent);
  }
  .phase-dns { --phase: var(--phase-dns); }
  .phase-connect { --phase: var(--phase-connect); }
  .phase-tls { --phase: var(--phase-tls); }
  .phase-server { --phase: var(--phase-server); }
  .phase-transfer { --phase: var(--phase-transfer); }

  /*
   * The cumulative marks (curl's namelookup / pretransfer / starttransfer)
   * hang from dashed guides at the boundary each one closes. Lanes are
   * assigned after measuring, so two nearby marks never print over each other.
   */
  .ladder { position: relative; margin-top: 6px; }
  .anchor { position: absolute; top: 0; width: 0; }
  .anchor .guide {
    position: absolute;
    left: 0;
    top: 0;
    width: 0;
    border-left: 1px dashed color-mix(in srgb, var(--ink) 32%, transparent);
  }
  .anchor .ladder-label {
    position: absolute;
    top: 0;
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    padding: 0 3px;
    background: var(--bg);
    font-size: 10.5px;
    line-height: 1.45;
    color: var(--muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .anchor .dot { width: 5px; height: 5px; flex: none; border-radius: 50%; background: var(--phase); }
  .anchor b { color: var(--ink); font-weight: 600; }

  /*
   * A fresh report plays itself in: each span grows from its start edge into
   * its share of the bar, the strip labels rise with it, and every cumulative
   * mark drops in when the bar reaches its boundary. The page adds `.enter`
   * only for that first arrival; a resize redraws the same markup without it,
   * and a reduced-motion preference skips the replay entirely.
   */
  .segment { transition: width 380ms cubic-bezier(0.22, 0.61, 0.36, 1); }
  .enter {
    animation-duration: 260ms;
    animation-timing-function: ease;
    animation-fill-mode: both;
  }
  .tick.enter { animation-name: tick-in; }
  .phase-cell.enter { animation-name: cell-in; }
  .anchor .guide.enter { animation-name: guide-in; transform-origin: top center; }
  .anchor .ladder-label.enter { animation-name: mark-in; }
  .phases tbody tr.enter { animation-name: row-in; }

  @keyframes tick-in { from { opacity: 0; } }
  @keyframes cell-in { from { opacity: 0; transform: translateY(3px); } }
  @keyframes guide-in { from { transform: scaleY(0); } }
  @keyframes mark-in { from { opacity: 0; transform: translateY(-3px); } }
  @keyframes row-in { from { opacity: 0; transform: translateY(2px); } }

  .phases { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  .phases thead th {
    padding: 0 8px 6px;
    text-align: right;
    font-size: 10px;
    font-weight: 650;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
  }
  .phases thead th:first-child { text-align: left; }
  .phases tbody th {
    padding: 7px 8px;
    text-align: left;
    font-weight: 500;
    border-bottom: 1px solid var(--line);
  }
  .phases tbody td {
    padding: 7px 8px;
    text-align: right;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
  }
  .phases tbody td:nth-child(3) { color: var(--ink); font-weight: 600; }
  .phases tbody tr:last-child th,
  .phases tbody tr:last-child td { border-bottom: 0; }
  .phases .swatch {
    display: inline-block;
    width: 8px;
    height: 8px;
    margin-right: 7px;
    border-radius: 2px;
    background: var(--phase);
  }

  .headers {
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--panel);
    overflow: hidden;
  }
  .headers summary {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 9px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    list-style: none;
  }
  .headers summary::-webkit-details-marker { display: none; }
  .headers summary:focus-visible { box-shadow: inset 0 0 0 1px var(--focus); }
  .chevron { width: 12px; height: 12px; flex: none; color: var(--muted); transition: transform 0.12s ease; }
  .headers[open] .chevron { transform: rotate(90deg); }
  .headers .count { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .headers-body { max-height: 240px; overflow: auto; border-top: 1px solid var(--line); }
  .headers table { width: 100%; border-collapse: collapse; font: 11.5px/1.5 var(--mono); }
  .headers td { padding: 5px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .headers tr:last-child td { border-bottom: 0; }
  .header-name { width: 34%; color: var(--muted); white-space: nowrap; }
  .header-value { color: var(--ink); overflow-wrap: anywhere; word-break: break-word; }

  .note { margin: 0; font-size: 11.5px; color: var(--muted); }

  .actions {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-top: 1px solid var(--line);
    background: color-mix(in srgb, var(--ink) 2.5%, transparent);
  }
  .actions button {
    height: 30px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--panel);
    color: var(--ink);
    font: 600 11.5px/1 var(--body);
  }
  .actions button:hover:not(:disabled) { border-color: var(--muted); }
  .actions button:disabled { opacity: 0.5; cursor: default; }
  .actions button:focus-visible { box-shadow: inset 0 0 0 1px var(--focus); }
  .hint { margin-left: auto; font-size: 11px; color: var(--muted); }

  @media (max-width: 560px) {
    .probe { align-items: stretch; }
    .verdict { flex-direction: column; align-items: flex-start; gap: 8px; }
    .verdict-total { align-items: flex-start; }
    /* A narrow card stacks each mark's name over its value, which keeps two
       lanes enough for four checkpoints. */
    .anchor .ladder-label { flex-direction: column; align-items: flex-start; gap: 0; line-height: 1.35; }
    .anchor .dot { display: none; }
    .phases thead th:nth-child(2),
    .phases tbody td:nth-child(2) { display: none; }
    .header-name { width: 42%; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .chevron { transition: none; }
    .segment { transition: none; }
    /* Every reveal rule names the same two classes as the rule it overrides. */
    .tick.enter,
    .phase-cell.enter,
    .anchor .guide.enter,
    .anchor .ladder-label.enter,
    .phases tbody tr.enter { animation: none; }
  }
</style>
</head>
<body>
  <header class="doc-head">
    <svg class="doc-icon" viewBox="0 0 16 16" aria-hidden="true">
      <circle cx="8" cy="9" r="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <path d="M8 6.4v2.8l1.8 1.1M6.4 1.6h3.2M8 1.6V4" fill="none" stroke="currentColor"
            stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <span class="doc-title">httpstat</span>
    <button id="doc-close" class="doc-close" type="button" aria-label="关闭">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M4.5 4.5l7 7M11.5 4.5l-7 7" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <form id="probe-form" class="probe" autocomplete="off">
    <label class="field" for="url">
      <span class="field-label">地址</span>
      <input id="url" name="url" type="text" maxlength="4096" spellcheck="false"
             inputmode="url" autocapitalize="off" placeholder="https://example.com/">
    </label>
    <button id="run" type="submit">计时</button>
  </form>

  <main>
    <div class="shell">
      <p id="status" class="status" role="status" aria-live="polite"></p>

      <section id="error" class="error" hidden>
        <p id="error-message"></p>
        <button id="retry" type="button">重试</button>
      </section>

      <section id="result" class="result" hidden>
        <div class="verdict">
          <div class="verdict-main">
            <span id="status-code" class="status-code">200</span>
            <span id="status-text" class="status-text"></span>
          </div>
          <div class="verdict-total">
            <span class="verdict-label">总计</span>
            <span id="total" class="total">0.0 ms</span>
          </div>
        </div>
        <p id="facts" class="facts"></p>

        <section class="waterfall" aria-label="阶段时间线">
          <div id="phase-strip" class="phase-strip"></div>
          <div id="track" class="track"></div>
          <div id="marks" class="ladder"></div>
        </section>

        <table class="phases">
          <thead>
            <tr>
              <th scope="col">阶段</th>
              <th scope="col">开始</th>
              <th scope="col">耗时</th>
              <th scope="col">占比</th>
            </tr>
          </thead>
          <tbody id="phases"></tbody>
        </table>

        <details id="headers-block" class="headers">
          <summary>
            <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M6 3.5l5 4.5-5 4.5" fill="none" stroke="currentColor"
                    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            响应头 <span id="headers-count" class="count">0</span>
          </summary>
          <div class="headers-body">
            <table>
              <tbody id="headers"></tbody>
            </table>
          </div>
        </details>

        <p id="truncated" class="note" hidden>正文超过 8 MiB，传输时间按已读取的部分计算。</p>
      </section>
    </div>
  </main>

  <footer class="actions">
    <button id="copy" type="button" disabled>复制报告</button>
    <span class="hint">回车计时 · Esc 关闭</span>
  </footer>

<script>
<!--bundle-->
</script>
</body>
</html>
